apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: nginx-demo
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/DineshBabu21/argo-cd.git
        targetRevision: HEAD
        path: Nginx
    destination:
        server: https://kubernetes.default.svc
        namespace: demo